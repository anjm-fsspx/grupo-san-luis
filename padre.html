  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{min-height:100vh;background:#f0f4f8;font-family:'Palatino Linotype',Palatino,Georgia,serif;display:flex;flex-direction:column;align-items:center;padding-bottom:60px;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    @keyframes shake{0%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}100%{transform:translateX(0)}}
    @keyframes modalIn{from{opacity:0;transform:translateY(-20px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
    @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

    .header{width:100%;background:linear-gradient(170deg,#1e3a5f 0%,#162d4a 100%);padding:20px 24px 16px;text-align:center;border-bottom:4px solid #a89060;}
    .header-images{display:flex;justify-content:center;align-items:center;gap:16px;margin-bottom:10px;}
    .header-images img.logo{width:80px;height:80px;border-radius:50%;object-fit:cover;border:2px solid #a89060;}
    .header-images img.saint{width:68px;height:82px;border-radius:8px;object-fit:cover;border:2px solid #a89060;}
    .header-center{flex:1;max-width:200px;}
    .header-eyebrow{font-size:9px;letter-spacing:4px;color:#e8d5a0;text-transform:uppercase;margin-bottom:4px;}
    .header-title{font-size:clamp(14px,3.5vw,18px);color:#fff;font-weight:normal;margin-bottom:2px;}
    .header-sub{font-size:11px;color:rgba(240,224,160,.85);letter-spacing:1px;}
    .header-date{color:#c8d4e0;font-size:12px;font-style:italic;margin-top:8px;}

    .content{width:100%;max-width:600px;padding:16px 14px;}

    .month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
    .month-nav-btn{background:none;border:1px solid rgba(168,144,96,.4);border-radius:50%;width:32px;height:32px;color:#a89060;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;touch-action:manipulation;}
    .month-title{font-family:Georgia,serif;font-size:16px;color:#1e3a5f;text-transform:capitalize;}

    .top-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
    .total-box{background:rgba(168,144,96,.08);border:1px solid rgba(168,144,96,.3);border-radius:10px;padding:12px 20px;text-align:center;}
    .total-num{font-size:30px;font-weight:bold;color:#a89060;font-family:Georgia,serif;}
    .total-label{font-size:10px;color:#6b7a8d;font-style:italic;}
    .refresh-btn{background:none;border:1px solid rgba(168,144,96,.4);border-radius:20px;color:#a89060;font-size:11px;padding:6px 14px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:5px;touch-action:manipulation;}

    .section-title{font-family:Georgia,serif;font-size:13px;color:#1e3a5f;margin:16px 0 10px;font-style:italic;border-bottom:1px solid rgba(168,144,96,.25);padding-bottom:4px;}

    /* MEMBER TABLE */
    .member-table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:20px;}
    .member-table th{background:#1e3a5f;color:#a89060;padding:8px 10px;text-align:left;font-family:Georgia,serif;font-weight:normal;font-size:11px;letter-spacing:1px;}
    .member-table th.center{text-align:center;}
    .member-table td{padding:7px 10px;border-bottom:1px solid rgba(168,144,96,.1);color:#2d3a4a;vertical-align:middle;}
    .member-table tr:nth-child(even) td{background:rgba(168,144,96,.04);}
    .member-table td.center{text-align:center;}
    .member-count{font-weight:bold;color:#a89060;}
    .member-days{color:#6b7a8d;font-size:11px;}
    .progress-cell{width:80px;}
    .mini-bar-wrap{height:4px;background:rgba(168,144,96,.15);border-radius:2px;overflow:hidden;}
    .mini-bar-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,#7a6845,#a89060);}
    .complete-star{color:#a89060;font-size:13px;}

    /* PRAYER SUMMARY */
    .prayer-grid{display:flex;flex-direction:column;gap:6px;}
    .prayer-row{background:white;border:1px solid rgba(168,144,96,.15);border-radius:8px;padding:9px 12px;display:flex;align-items:center;gap:10px;}
    .prayer-row-name{flex:1;font-size:13px;font-family:Georgia,serif;color:#2d3a4a;}
    .prayer-row-count{font-size:16px;font-weight:bold;color:#a89060;min-width:30px;text-align:right;}
    .prayer-row-bar{flex:2;height:4px;background:rgba(168,144,96,.12);border-radius:2px;overflow:hidden;}
    .prayer-row-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,#7a6845,#a89060);}

    /* MODAL */
    .modal-overlay{position:fixed;inset:0;z-index:100;background:rgba(10,8,3,.85);display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px);}
    .modal-box{background:#f0f4f8;border:2px solid #a89060;border-radius:16px;padding:36px 32px;width:100%;max-width:340px;text-align:center;animation:modalIn .3s ease;}
    .modal-icon{font-size:30px;margin-bottom:12px;}
    .modal-title{font-family:Georgia,serif;font-size:18px;color:#1e3a5f;margin-bottom:6px;font-weight:normal;}
    .modal-note{font-size:13px;color:#6b7a8d;font-style:italic;margin-bottom:20px;}
    .pw-input{width:100%;padding:11px 14px;border-radius:8px;border:1.5px solid rgba(168,144,96,.4);background:white;font-family:inherit;font-size:16px;color:#1a2332;margin-bottom:6px;text-align:center;letter-spacing:2px;}
    .pw-input:focus{outline:none;border-color:#a89060;}
    .pw-input.error{border-color:#c0392b;animation:shake .45s ease;}
    .pw-error{color:#c0392b;font-size:12px;margin-bottom:10px;font-style:italic;}
    .modal-submit{width:100%;padding:11px;background:#1e3a5f;border:none;border-radius:8px;color:#a89060;cursor:pointer;font-family:inherit;font-size:14px;font-weight:bold;letter-spacing:1px;}
  </style>
</head>
<body>

<!-- PASSWORD MODAL -->
<div class="modal-overlay" id="authModal">
  <div class="modal-box">
    <div class="modal-icon">✝</div>
    <div class="modal-title">Acceso — Padre</div>
    <div class="modal-note">Ingresa la contraseña para ver el registro del grupo</div>
    <input class="pw-input" id="pwInput" type="password" placeholder="Contraseña"
           oninput="clearErr()" onkeydown="if(event.key==='Enter')submitPw()"/>
    <div class="pw-error" id="pwError" style="display:none;">Contraseña incorrecta</div>
    <div style="margin-bottom:14px;"></div>
    <button class="modal-submit" onclick="submitPw()">Entrar</button>
  </div>
</div>

<script>
const PADRE_PASSWORD = "Rx9#mK2$vLpN7@qW";
const MEMBERS = {"224906": "Ayala López Emmanuel", "435003": "Barrantes Hernandez Andres", "626925": "Bonilla González José Manuel", "636685": "Botello Herrera Dulce Maria", "778636": "Botello Herrera Juan Francisco", "207622": "Contreras Ramos Coral", "334130": "Corral Herrera Ana Maria", "730226": "Corral Herrera Antonio De Jesús", "751673": "Corral Herrera Francisco", "683594": "Corral Herrera Luis Felipe", "541046": "Corral Herrera Victor", "921426": "Dipp Espinosa Jesus Amin", "700381": "Flores Ordaz Linda", "674421": "Herrera Castilla Iliana Elizabeth", "983322": "Herrera Castilla Ximena Esperanza", "866025": "Herrera López Clara Inés", "914295": "Herrera López Cris Armando", "905427": "Herrera López Enrique Joseph", "614750": "Herrera López Maria Concepción", "887507": "Herrera López Maria Goretti", "910625": "Herrera López Sherry", "715011": "Herrera Martinez Bernardo", "562521": "Herrera Martinez Fatima", "351589": "Herrera Martinez Luis Eduardo", "102657": "Herrera Martinez Maria Regina", "744039": "Herrera Romo Jesús Maria", "184644": "López Flores Sofia", "216115": "López Gurrola Cecilia", "401193": "López Gurrola Daniela", "956436": "López Gurrola Fabian", "202814": "López Gurrola Guillermo", "571497": "López Gurrola Montse", "112046": "López Herrera Beatriz Del Carmen", "954340": "López Herrera Maria De Jesus", "818461": "López Herrera Maria José", "614102": "Mejia Aviña Lorena Arcangel", "812390": "Mejia Aviña Paola Ximena", "429497": "Miron Espinosa Ilich Adrian", "320436": "Pineda Aguilar Karla Liliana", "516512": "Garrett Liam"};
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDIx3w7WfTp7p353J5_FPf7-Uxyr6khn6c",
  authDomain: "ramilletes---san-luis-gonzaga.firebaseapp.com",
  databaseURL: "https://ramilletes---san-luis-gonzaga-default-rtdb.firebaseio.com",
  projectId: "ramilletes---san-luis-gonzaga",
  storageBucket: "", messagingSenderId: "", appId: "1:0:web:0"
};
const PRAYERS = [
  {id:"misa",        name:"Misa"},
  {id:"comunion_s",  name:"Comunión Sacramental"},
  {id:"comunion_e",  name:"Comunión Espiritual"},
  {id:"oraciones_m", name:"Oraciones de Mañana"},
  {id:"oraciones_n", name:"Oraciones de Noche"},
  {id:"rosario",     name:"Rosario"},
  {id:"angelus",     name:"Ángelus"},
  {id:"reto",        name:"Reto"},
  {id:"sacrificio",  name:"Sacrificio"},
  {id:"accion",      name:"Acción"},
];
const TOTAL=PRAYERS.length;

function getMonthKey(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function fmtName(n){
  const p=n.split(' '); return p[p.length-1]+' '+p[0];
}

let db=null, currentMonth=null, allData={};

function submitPw(){
  if(document.getElementById('pwInput').value===PADRE_PASSWORD){
    document.getElementById('authModal').style.display='none';
    init();
  }else{
    const inp=document.getElementById('pwInput');
    inp.classList.add('error');
    document.getElementById('pwError').style.display='block';
    inp.value='';
    setTimeout(()=>inp.classList.remove('error'),500);
  }
}
function clearErr(){
  document.getElementById('pwError').style.display='none';
  document.getElementById('pwInput').classList.remove('error');
}

function init(){
  currentMonth=getMonthKey();
  document.getElementById('headerDate').textContent=
    new Date().toLocaleDateString('es-MX',{weekday:'long',month:'long',day:'numeric'});
  if(!firebase.apps||!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
  db=firebase.database();
  updateLabel();
  loadData();
}

function updateLabel(){
  const [y,m]=currentMonth.split('-').map(Number);
  const label=new Date(y,m-1,1).toLocaleDateString('es-MX',{month:'long',year:'numeric'});
  document.getElementById('monthTitle').textContent=label;
  document.getElementById('nextBtn').style.opacity=currentMonth===getMonthKey()?'0.3':'1';
}

function changeMonth(dir){
  const [y,m]=currentMonth.split('-').map(Number);
  const d=new Date(y,m-1+dir,1);
  const nm=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  if(nm>getMonthKey()) return;
  currentMonth=nm;
  updateLabel();
  loadData();
}

function loadData(){
  if(!db) return;
  const icon=document.getElementById('refreshIcon');
  icon.style.animation='spin .6s linear infinite';
  db.ref('data/'+currentMonth).once('value',snap=>{
    allData=snap.val()||{};
    icon.style.animation='';
    render();
  });
}

function render(){
  const prayerTotals={};
  PRAYERS.forEach(p=>prayerTotals[p.id]=0);
  let grandTotal=0;

  // Member table
  const tbody=document.getElementById('memberBody');
  tbody.innerHTML='';
  const daysInMonth=new Date(...currentMonth.split('-').map((v,i)=>i===1?Number(v):Number(v)), 0).getDate();

  Object.entries(MEMBERS).sort((a,b)=>fmtName(a[1]).localeCompare(fmtName(b[1]))).forEach(([pin,name])=>{
    const days=allData[pin]||{};
    let total=0, activeDays=0, fullDays=0;
    Object.values(days).forEach(d=>{
      const c=Object.values(d).filter(Boolean).length;
      if(c>0){ activeDays++; total+=c; if(c===TOTAL) fullDays++; }
      PRAYERS.forEach(p=>{ if(d[p.id]) prayerTotals[p.id]++; });
    });
    grandTotal+=total;
    const pct=daysInMonth>0?Math.round((activeDays/daysInMonth)*100):0;
    const tr=document.createElement('tr');
    tr.innerHTML=`
      <td>${fmtName(name)}</td>
      <td class="center member-count">${total||'—'}</td>
      <td class="center member-days">${activeDays||'—'}</td>
      <td class="center progress-cell">
        <div class="mini-bar-wrap"><div class="mini-bar-fill" style="width:${pct}%"></div></div>
      </td>
      <td class="center">${fullDays>0?'<span class="complete-star">✦ '+fullDays+'</span>':''}</td>`;
    tbody.appendChild(tr);
  });

  document.getElementById('totalNum').textContent=grandTotal||'0';

  // Prayer totals
  const grid=document.getElementById('prayerGrid');
  grid.innerHTML='';
  const maxVal=Math.max(...Object.values(prayerTotals),1);
  PRAYERS.forEach(p=>{
    const c=prayerTotals[p.id];
    const pct=Math.round((c/maxVal)*100);
    const div=document.createElement('div');
    div.className='prayer-row';
    div.innerHTML=`
      <span class="prayer-row-name">${p.name}</span>
      <div class="prayer-row-bar"><div class="prayer-row-fill" style="width:${pct}%"></div></div>
      <span class="prayer-row-count">${c}</span>`;
    grid.appendChild(div);
  });
}

window.addEventListener('DOMContentLoaded',()=>{
  setTimeout(()=>document.getElementById('pwInput').focus(),100);
});
</script>
